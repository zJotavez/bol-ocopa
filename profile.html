            'https://lh3.googleusercontent.com/aida-public/AB6AXuDI2oqkORNK4-ERD08kIKaDCstTvhrCpkBo_l-gjHTrOjiGJOfMriXhaHaccmWQg4yuBtHDs_sxF6KgjtcZMvCFW50FjN967eUE4phXYBUWhXmRmV2W6v1CbEfjKpD8-59iRsYs8ylSN5SYXUCCXcWoQEmjxXeIsOMxnaT90qkwcMwJhdBrgK8XKdlV88wEuNMlZgK1XgYqQYW222Ju_0y1iK0fvuFESwBrBRtlST9CY0acBMOCCS3hOiJbp-fNxus9t7tk5jrYFoQ'
        ];

        let selectedAvatarUrl = '';

        function renderProfile(isInitialLoad = false) {
            const user = getLoggedUser();
            const db = getDB();
            if (!user) return;
            
            // Garante o recálculo dos pontos
            const results = recalcularPontosGeral();
            
            // Salva o avatar atual selecionado se for carga inicial ou se não estiver definido
            if (isInitialLoad || !selectedAvatarUrl) {
                selectedAvatarUrl = user.foto || avataresPredefinidos[0];
            }
            
            // Renderiza textos
            document.getElementById('user-profile-img').src = selectedAvatarUrl;
            document.getElementById('user-role-badge').innerText = user.role.toUpperCase();
            document.getElementById('user-display-name').innerText = user.nome;
            document.getElementById('user-display-email').innerText = user.email;
            
            document.getElementById('user-stat-points').innerText = results.points || results.pontos || 0;
            document.getElementById('user-stat-exatos').innerText = user.placares_exatos;
            document.getElementById('user-stat-rank').innerText = `${results.posicao}º`;
            
            // Preenche inputs apenas na carga inicial
            if (isInitialLoad) {
                document.getElementById('edit-name').value = user.nome;
                document.getElementById('edit-email').value = user.email;
            }
            
            // Renderiza seletor de avatares (incluindo o personalizado se houver)
            const avatarContainer = document.getElementById('avatar-list');
            const isCustom = selectedAvatarUrl && selectedAvatarUrl.startsWith('data:image');
            
            let avatarHtml = avataresPredefinidos.map((url, idx) => {
                const isSelected = url === selectedAvatarUrl;
                return `
                <div class="avatar-option w-12 h-12 rounded-full overflow-hidden border-2 cursor-pointer transition-all hover:scale-105 ${isSelected ? 'selected border-primary' : 'border-outline-variant/30'}" onclick="selectAvatar('${url}', this)">
                    <img class="w-full h-full object-cover" src="${url}" alt="Avatar ${idx + 1}"/>
                </div>`;
            }).join('');
            
            if (isCustom) {
                avatarHtml += `
                <div class="avatar-option w-12 h-12 rounded-full overflow-hidden border-2 cursor-pointer transition-all hover:scale-105 selected border-primary">
                    <img class="w-full h-full object-cover" src="${selectedAvatarUrl}" alt="Avatar Personalizado"/>
                </div>`;
            }
            
            avatarHtml += `
            <div class="avatar-option w-12 h-12 rounded-full overflow-hidden border-2 cursor-pointer transition-all hover:scale-105 flex items-center justify-center bg-surface-container border-outline-variant/30 relative" onclick="triggerAvatarUpload()">
                <span class="material-symbols-outlined text-outline text-[20px]">add_a_photo</span>
            </div>`;
            
            avatarContainer.innerHTML = avatarHtml;

            // Mostra seção de admin se aplicável
            if (user.role === 'admin') {
                document.getElementById('admin-access-section').classList.remove('hidden');
            } else {
                document.getElementById('admin-access-section').classList.add('hidden');
            }
        }

        function triggerAvatarUpload() {
            document.getElementById('custom-avatar-file').click();
        }

        function handleCustomAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Comprime e redimensiona a imagem usando Canvas para economizar espaço
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 120;
                    const MAX_HEIGHT = 120;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Converte para jpeg base64 com qualidade reduzida (0.7)
                    const base64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    // Salva como avatar selecionado
                    selectedAvatarUrl = base64;
                    document.getElementById('user-profile-img').src = base64;
                    
                    // Re-renderiza o painel mantendo a seleção e o que já foi digitado
                    renderProfile(false);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function selectAvatar(url, element) {
            selectedAvatarUrl = url;
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected', 'border-primary'));
            element.classList.add('selected', 'border-primary');
            document.getElementById('user-profile-img').src = url;
        }

        function salvarPerfil() {
            const nomeInput = document.getElementById('edit-name').value;
            const emailInput = document.getElementById('edit-email').value;
            
            if (nomeInput === '' || emailInput === '') {
                alert('Preencha nome e e-mail antes de salvar!');
                return;
            }
            
            const success = updateLoggedUserProfile(nomeInput, emailInput, selectedAvatarUrl);
            if (success) {
                alert('Perfil atualizado com sucesso!');
                renderProfile(true);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProfile(true);
        });
    </script>
